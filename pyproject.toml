[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lcicpflow"
version = "0.1.0"
description = "Clean modular ICP-Flow implementation for LiDAR scene flow."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "open3d>=0.18",
  "matplotlib>=3.7",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
hdbscan = ["hdbscan>=0.8.33"]
gpu = ["cupy-cuda12x>=13.0"]
kiss = ["kiss-icp>=1.0"]

[project.scripts]
lcicpflow-pair = "lcicpflow.pipeline.run_pair:main"
lcicpflow-folder = "lcicpflow.pipeline.run_folder:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
